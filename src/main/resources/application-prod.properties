spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Render (and similar): PORT is set by the platform. JDBC URL stays H2 unless you override.
server.port=${PORT:9090}

# Example env: SPRING_PROFILES_ACTIVE=prod
#              MSE_JWT_SECRET=<long random secret, 32+ bytes for HS256>
#              MSE_CORS_ORIGINS=https://your-frontend.example.com
#              DATABASE_URL=jdbc:h2:file:./data/mse;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:msedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}

management.endpoints.web.exposure.include=health
