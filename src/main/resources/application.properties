spring.application.name=mseserver
spring.profiles.active=dev

server.port=9090

spring.datasource.url=jdbc:h2:mem:msedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

mse.jwt.secret=${MSE_JWT_SECRET:change-this-secret-key-min-256-bits-for-hs256-algorithm-dev-only-please}
mse.jwt.expiration-ms=86400000

mse.cors.allowed-origin-patterns=${MSE_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized
